name: Package exe with PyInstaller - Windows

on:
  push:
    branches: [main, dev]
  release:
    types: [published]
  # Until now a broken build only showed up after a push to main, which is how
  # the Wine image could rot unnoticed for days. The release steps below are
  # gated on push/release, so a pull request builds and tests and nothing else.
  pull_request:
    paths:
      - '.github/workflows/pyinstaller.yml'
      - 'pyinstaller/**'
  # Builds, tests and signs without publishing anything, so the signing setup
  # can be exercised without cutting a release.
  workflow_dispatch:

# Two builds racing on the same branch could leave the nightly tag pointing at
# one commit while the .exe attached to the release was built from the other.
# Manual runs get their own group: they publish nothing, and a signing request
# waiting for approval must not be cancelled by the next push to main.
concurrency:
  group: pyinstaller-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Needed by "Move the nightly tag to the built commit" below, which force-updates
# a ref under refs/tags/.
permissions:
  contents: write

env:
  # Deliberately prefixed. A tag named after the branch it was built from shadows
  # that branch, and a bare `main` then resolves to the tag in every clone:
  # `git rev-parse main` warns "refname 'main' is ambiguous" and answers with the
  # tag, not the branch head.
  NIGHTLY_TAG: nightly-${{ github.ref_name }}

jobs:
  build:
    # A real Windows runner, not Wine. The old setup built inside a third-party
    # action carrying an Ubuntu 18.04 + Wine image, and it died the moment
    # ubuntu-latest moved to Ubuntu 26.04: `winetricks -q vcrun2019` answers
    # "wine: socket : Function not implemented" and the image never builds.
    # Nothing in that action had changed since March 2025, which is the point:
    # the build depended on an environment nobody maintains.
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # maigret comes from the checkout, not from a zip of main, so the exe
      # matches the commit being built.
      - name: Install build dependencies
        run: |
          pip install ".[pdf]"
          pip install -r pyinstaller/requirements.txt

      - name: PyInstaller Windows Build
        working-directory: pyinstaller
        run: pyinstaller --clean --noconfirm maigret_standalone.spec

      # A onefile build that misses a hidden import still produces an .exe, and
      # the gap shows up only when a user runs it. --help exercises the import
      # chain; the real search then exercises what is imported lazily, which is
      # where PyInstaller actually loses things (report writers above all).
      #
      # pwsh only fails a step on the exit code of its last command, so every
      # call is checked by hand.
      - name: Smoke-test the binary
        run: |
          .\pyinstaller\dist\maigret_standalone.exe --help
          if ($LASTEXITCODE -ne 0) { throw "--help exited with $LASTEXITCODE" }

          .\pyinstaller\dist\maigret_standalone.exe soxoj --site GitHub --no-recursion --timeout 30 -H -X -P
          if ($LASTEXITCODE -ne 0) { throw "search exited with $LASTEXITCODE" }

          Get-ChildItem reports
          if (-not (Get-ChildItem reports -Filter *.html -ErrorAction SilentlyContinue)) {
            throw 'no HTML report was written'
          }
          if (-not (Get-ChildItem reports -Filter *.xmind -ErrorAction SilentlyContinue)) {
            throw 'no XMind report was written'
          }
          if (-not (Get-ChildItem reports -Filter *.pdf -ErrorAction SilentlyContinue)) {
            throw 'no PDF report was written'
          }

      - name: Upload PyInstaller Binary to Workflow as Artifact
        if: success()
        # The sign job fetches the binary by this id.
        id: upload_unsigned
        uses: actions/upload-artifact@v7
        with:
          name: maigret_standalone_win64
          path: pyinstaller/dist/maigret_standalone.exe

      # release-action creates a tag only when it does not exist yet, and GitHub
      # ignores target_commitish once the tag is there ("Unused if the Git tag
      # already exists"). So the tag has to be moved here, otherwise it stays
      # pinned to the first build forever while the attached .exe keeps being
      # replaced on every push.
      - name: Move the nightly tag to the built commit
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git tag --force "$NIGHTLY_TAG" "$GITHUB_SHA"
          # Tag pushes do not match `on.push.branches`, and pushes authenticated
          # with GITHUB_TOKEN never start a workflow run, so this cannot recurse.
          git push --force origin "refs/tags/$NIGHTLY_TAG"

      # The release object is updated in place on every push, and GitHub keeps
      # `published_at` from the day it was first created, so the releases list
      # shows a months-old date next to a binary built minutes ago. The action
      # has no input for the date (29 inputs, none of them a timestamp), so the
      # build time goes into the name and the body instead, where it is read.
      - name: Stamp the nightly build
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Create New Release and Upload PyInstaller Binary to Release
        if: success() && github.event_name == 'push'
        uses: ncipollo/release-action@v1.14.0
        id: create_release
        with:
          allowUpdates: true
          draft: false
          # A development build must never outrank a stable release. `prerelease`
          # keeps it out of /releases/latest, and `makeLatest: false` stops it
          # from stealing the marker back on the next push to main.
          prerelease: true
          artifactErrorsFailBuild: true
          makeLatest: false
          replacesArtifacts: true
          artifacts: pyinstaller/dist/maigret_standalone.exe
          name: Nightly Windows build [${{ github.ref_name }}] ${{ env.BUILD_DATE }} (${{ env.SHORT_SHA }})
          tag: ${{ env.NIGHTLY_TAG }}
          commit: ${{ github.sha }}
          body: |
            **Nightly build, not a stable release.** Built from the **${{ github.ref_name }}** branch at commit ${{ github.sha }}, on ${{ env.BUILD_TIME }}.

            The date shown next to this release in the list is the day it was first created, not the day this binary was built: GitHub keeps `published_at` when a release is updated in place. The build time above is the one to trust.

            The `${{ env.NIGHTLY_TAG }}` tag is moved to that commit on every build, so it always matches the binary attached below, and the binary is replaced on every push.

            **Looking for the stable Windows build?** Every numbered release carries `maigret_standalone.exe` as an attached asset, built from its tag: see [the latest release](https://github.com/soxoj/maigret/releases/latest).

            ${{ github.ref_name == 'dev' && 'The `dev` branch is more experimental than `main`. Unless you need a specific unreleased fix, prefer [the `main` development build](https://github.com/soxoj/maigret/releases/tag/nightly-main).' || '' }}

            ## How to run

            1. Download the attached `maigret_standalone.exe`.
            2. Either:
               - **Double-click it** — Maigret will ask you for a username, run a default search, and pause at the end so the output stays visible.
               - **Run it from a terminal** for full options. Press `Win+R`, type `cmd`, hit Enter (or open PowerShell), then:

                 ```cmd
                 cd %USERPROFILE%\Downloads
                 maigret_standalone.exe USERNAME
                 maigret_standalone.exe USERNAME --html       :: also save an HTML report
                 maigret_standalone.exe --help                :: list all options
                 ```

            Video guide: https://youtu.be/qIgwTZOmMmM
            Full documentation: https://maigret.readthedocs.io/en/latest/

        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A published release already has its title, notes and prerelease flag set
      # by whoever published it. release-action would overwrite all three with its
      # own defaults during an update, so every omit*DuringUpdate is on: this step
      # attaches the binary and touches nothing else.
      - name: Attach the binary to the published release
        if: success() && github.event_name == 'release'
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          omitDraftDuringUpdate: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          artifacts: pyinstaller/dist/maigret_standalone.exe
          tag: ${{ github.event.release.tag_name }}

  # Signing is a separate job because production signing requests wait for a
  # manual approval in SignPath, which can take hours, and the build should not
  # sit on a Windows runner meanwhile.
  #
  # Only releases and manual runs are signed. The nightly build runs on every
  # push to main and dev, and spending the Foundation's quota on binaries that
  # live a day would leave none for the releases people keep.
  #
  # The policy is test-signing until the release certificate is issued. Its
  # signature is deliberately untrusted, so the signed file is kept as a
  # workflow artifact and attached to nothing: an untrusted signature on a
  # released binary reads as tampering and is worse than no signature.
  sign:
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The workflow-wide permissions grant contents only, and SignPath fetches
    # the unsigned artifact with this job's token, which needs actions: read.
    permissions:
      actions: read
      contents: read
    steps:
      - name: Submit signing request and wait for it
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: maigret
          signing-policy-slug: test-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          # Room for a manual approval, inside the 6 hour job limit.
          wait-for-completion-timeout-in-seconds: 20000
          output-artifact-directory: signed

      - name: Upload the signed binary to the workflow
        uses: actions/upload-artifact@v7
        with:
          name: maigret_standalone_win64_signed
          path: signed/maigret_standalone.exe
          if-no-files-found: error
